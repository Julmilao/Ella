[build]
builder = "nixpacks"
buildCommand = "pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=/app/.playwright-browsers python -m playwright install chromium --with-deps"

[deploy]
startCommand = "uvicorn main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
