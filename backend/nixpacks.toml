[phases.setup]
nixPkgs = [
  "python311",
  # Dependências de sistema para o Playwright/Chromium no Linux
  "chromium",
  "nss",
  "nspr",
  "atk",
  "cups",
  "libdrm",
  "dbus",
  "libxkbcommon",
  "xorg.libX11",
  "xorg.libXcomposite",
  "xorg.libXdamage",
  "xorg.libXext",
  "xorg.libXfixes",
  "xorg.libXrandr",
  "mesa",
  "expat",
  "xorg.libxcb",
  "libxshmfence",
  "pango",
  "cairo",
  "alsa-lib",
]

[phases.install]
cmds = [
  "pip install -r requirements.txt",
  "PLAYWRIGHT_BROWSERS_PATH=/app/.playwright-browsers python -m playwright install chromium --with-deps",
]

[start]
cmd = "uvicorn main:app --host 0.0.0.0 --port $PORT"
